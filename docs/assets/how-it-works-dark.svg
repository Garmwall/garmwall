  <circle cx="794" cy="386" r="4" fill="#A5B4FC"/>
  <text x="806" y="391" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#A5B4FC">redact</text>

