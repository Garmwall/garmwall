  <circle cx="416" cy="386" r="4" fill="#34D399"/>
  <text x="428" y="391" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34D399">allow</text>

