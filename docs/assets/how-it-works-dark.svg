  <text x="442" y="144" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E7E9EE">pin</text>
  <text x="442" y="164" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9AA3B5">is this still the tool I approved?</text>

