  <text x="442" y="236" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9AA3B5">secrets · injection · exfiltration · shell</text>

  <rect x="380" y="262" width="520" height="58" rx="10" fill="#171B23" stroke="#232836"/>
  <circle cx="412" cy="291" r="14" fill="none" stroke="#FF7A45" stroke-width="1.5"/>
  <text x="412" y="296" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#FF7A45">3</text>
  <text x="442" y="288" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#E7E9EE">policy</text>
  <text x="442" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9AA3B5">Cedar rules · least privilege · deny by default</text>
  <text x="380" y="356" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#9AA3B5">decision</text>

