  <text x="64" y="226" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">Claude Code</text><text x="64" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">Cursor</text><text x="64" y="278" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">any MCP client</text>

  <rect x="1020" y="150" width="220" height="180" rx="14" fill="#11141A" stroke="#232836"/>
  <text x="1044" y="192" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E7E9EE">MCP servers</text>
  <text x="1044" y="226" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">filesystem</text><text x="1044" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">github</text><text x="1044" y="278" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9AA3B5">shell · http</text>
  <rect x="350" y="40" width="580" height="400" rx="18" fill="#11141A" stroke="#FF7A45" stroke-opacity="0.55" stroke-width="1.5"/>
  <use href="#mark" x="378" y="58" width="40" height="40"/>
  <text x="428" y="88" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-1" fill="#E7E9EE">garmwall</text>
  <text x="900" y="86" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9AA3B5">every tool call, checked</text>

  <rect x="380" y="118" width="520" height="58" rx="10" fill="#171B23" stroke="#232836"/>
  <circle cx="412" cy="147" r="14" fill="none" stroke="#FF7A45" stroke-width="1.5"/>
