  <rect x="778" y="372" width="96" height="28" rx="14" fill="#4F46E5" fill-opacity="0.12" stroke="#4F46E5" stroke-opacity="0.5"/>
  <circle cx="794" cy="386" r="4" fill="#4F46E5"/>
  <text x="806" y="391" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#4F46E5">redact</text>

