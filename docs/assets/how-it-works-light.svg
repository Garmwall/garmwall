<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Garmwall sits between the AI agent and its MCP servers: every call is pinned, scanned and checked against a policy, then allowed, paused for approval, denied or redacted.">
<defs><symbol id="mark" viewBox="0 0 64 64">
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <path d="M9 25 L12 1 L25 14 H39 L52 1 L55 25 V37 L42.5 56 Q41 58.5 38 58.5 H26 Q23 58.5 21.5 56 L9 37 Z" fill="#fff"/>
    <path d="M0 41.5 H64 M0 49 H64 M22 41.5 V49 M42 41.5 V49 M32 49 V64" stroke="#000" stroke-width="2.4"/>
  </mask>
  <path d="M9 25 L12 1 L25 14 H39 L52 1 L55 25 V37 L42.5 56 Q41 58.5 38 58.5 H26 Q23 58.5 21.5 56 L9 37 Z" fill="#0A0C10" mask="url(#m)"/>
  <path d="M17 27.5 L28.5 31 L26.6 34.6 L18.6 32 Z" fill="#FF7A45"/>
  <path d="M47 27.5 L35.5 31 L37.4 34.6 L45.4 32 Z" fill="#FF7A45"/>
</symbol></defs>
  <rect width="1280" height="480" rx="20" fill="#FAFAF7"/>

