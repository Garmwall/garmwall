  <text x="64" y="226" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">Claude Code</text><text x="64" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">Cursor</text><text x="64" y="278" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">any MCP client</text>

  <rect x="1020" y="150" width="220" height="180" rx="14" fill="#FFFFFF" stroke="#E2E4EA"/>
  <text x="1044" y="192" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0A0C10">MCP servers</text>
  <text x="1044" y="226" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">filesystem</text><text x="1044" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">github</text><text x="1044" y="278" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6475">shell · http</text>
  <rect x="350" y="40" width="580" height="400" rx="18" fill="#FFFFFF" stroke="#FF7A45" stroke-opacity="0.55" stroke-width="1.5"/>
  <use href="#mark" x="378" y="58" width="40" height="40"/>
  <text x="428" y="88" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-1" fill="#0A0C10">garmwall</text>
  <text x="900" y="86" text-anchor="end" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B6475">every tool call, checked</text>

  <rect x="380" y="118" width="520" height="58" rx="10" fill="#F3F4F6" stroke="#E2E4EA"/>
  <circle cx="412" cy="147" r="14" fill="none" stroke="#FF7A45" stroke-width="1.5"/>
  <text x="412" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#C2410C">1</text>
  <text x="442" y="144" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C10">pin</text>
  <text x="442" y="164" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B6475">is this still the tool I approved?</text>

  <rect x="380" y="190" width="520" height="58" rx="10" fill="#F3F4F6" stroke="#E2E4EA"/>
  <circle cx="412" cy="219" r="14" fill="none" stroke="#FF7A45" stroke-width="1.5"/>
