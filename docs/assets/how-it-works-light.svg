  <text x="442" y="216" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C10">scan</text>
  <text x="442" y="236" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B6475">secrets · injection · exfiltration · shell</text>

  <rect x="380" y="262" width="520" height="58" rx="10" fill="#F3F4F6" stroke="#E2E4EA"/>
  <circle cx="412" cy="291" r="14" fill="none" stroke="#FF7A45" stroke-width="1.5"/>
  <text x="412" y="296" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#C2410C">3</text>
  <text x="442" y="288" font-family="Geist, 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0C10">policy</text>
  <text x="442" y="308" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B6475">Cedar rules · least privilege · deny by default</text>
  <text x="380" y="356" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6475">decision</text>

  <rect x="400" y="372" width="96" height="28" rx="14" fill="#047857" fill-opacity="0.12" stroke="#047857" stroke-opacity="0.5"/>
  <circle cx="416" cy="386" r="4" fill="#047857"/>
  <text x="428" y="391" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#047857">allow</text>

