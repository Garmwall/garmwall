  <line x1="348" y1="270" x2="269" y2="270" stroke="#5B6475" stroke-width="1.6"/>
  <path d="M269 265 L262 270 L269 275 Z" fill="#5B6475"/>
  <text x="305.0" y="290" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5B6475">response</text>

